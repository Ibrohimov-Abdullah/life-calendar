name: life_calendar
description: "Track your life's journey — visualize time, set goals, and share your progress."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase & Auth
  # SETUP REQUIRED: Follow README or comments in lib/core/services/firebase_service.dart
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # UI & Responsive
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  gap: ^3.0.1

  # Share
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4

  # Utilities
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
